# ITIP docker-compose — 6 containers (§10.2)
#
#   qdrant-a, qdrant-b, redis | mcp-server, agent-system-b | agent-system-a
#
# Build Agent A/B from repo root so PROJECT_ROOT=/itip matches services/*/ layout.
# Streamlit UI is not containerised; run: streamlit run ui/app.py --server.port 8501
#
# Docker Desktop on Windows sometimes breaks embedded DNS (127.0.0.11); then Whisper /
# OpenAI calls fail with "Connection error" even with a valid key. Explicit resolvers fix it.
x-public-dns: &public-dns
  - 8.8.8.8
  - 8.8.4.4

services:

  # --- Vector databases ---
  qdrant-a:
    image: qdrant/qdrant:v1.12.5
    container_name: itip-qdrant-a
    ports:
      - "6333:6333"
    volumes:
      - qdrant_a_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inmind-network

  qdrant-b:
    image: qdrant/qdrant:v1.12.5
    container_name: itip-qdrant-b
    ports:
      - "6334:6333"
    volumes:
      - qdrant_b_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inmind-network

  # --- Session store ---
  redis:
    image: redis:7-alpine
    container_name: itip-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - inmind-network

  # --- MCP server (interview scheduling tools) ---
  mcp-server:
    dns: *public-dns
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: itip-mcp-server
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - inmind-network

  # --- Agent System B (Skills Matcher) ---
  agent-system-b:
    dns: *public-dns
    build:
      context: .
      dockerfile: services/agent-system-b/Dockerfile
    container_name: itip-agent-system-b
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - QDRANT_B_URL=http://qdrant-b:6333
    depends_on:
      qdrant-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inmind-network

  # --- Agent System A (Supervisor + 4 Specialists) ---
  agent-system-a:
    dns: *public-dns
    build:
      context: .
      dockerfile: services/agent-system-a/Dockerfile
    container_name: itip-agent-system-a
    ports:
      - "8000:8000"
    volumes:
      - ./models/track_classifier:/itip/models/track_classifier:ro
      - ./logs:/logs
      - ./data:/itip/data
    env_file:
      - .env
    environment:
      - QDRANT_A_URL=http://qdrant-a:6333
      - QDRANT_B_URL=http://qdrant-b:6333
      - AGENT_B_URL=http://agent-system-b:8001
      - MCP_URL=http://mcp-server:8002
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/logs
    depends_on:
      qdrant-a:
        condition: service_healthy
      qdrant-b:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      agent-system-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inmind-network

volumes:
  qdrant_a_storage:
  qdrant_b_storage:
  redis_data:

networks:
  inmind-network:
    driver: bridge
